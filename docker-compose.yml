services:
  frontend:
    build:
      context: ./services/frontend

    ports:
      - "8080:80"

    depends_on:
      - orchestrator-api
  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 5s

  ollama-init:
    image: ollama/ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "${MODEL_NAME:-qwen2.5:0.5b}"]
  inference-service:
    build:
      context: ./services/inference_service
    
    depends_on:
      ollama-init:
        condition: service_completed_successfully

    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      ]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:0.5b}
      HOST: 0.0.0.0
      PORT: 8000
      OLLAMA_TIMEOUT_SEC: 120

    command: 
      - "--rpm"
      - "60"
      - "--max-concurrency"
      - "4"

  orchestrator-api:
    build:
      context: ./services/orchestrator
    depends_on:
      inference-service:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      INFERENCE_ENDPOINT: http://inference-service:8000/infer
      DATABASE_URL: postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator
      REDIS_HOST: redis
      REDIS_PORT: 6379
    
    ports:
    - "3000:3000"

    command:
      - uv
      - run
      - uvicorn
      - orchestrator.interfaces.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "3000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  persistence-consumer:
    build:
      context: ./services/orchestrator

    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

    environment:
      DATABASE_URL: postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator
      REDIS_HOST: redis
      REDIS_PORT: 6379

    command:
      - python
      - -m
      - orchestrator.infrastructure.messaging.redis.persistence_consumer
  
  migrate:
    build:
      context: ./services/orchestrator
    command:
      - uv
      - run
      - alembic
      - upgrade
      - head
    environment:
      DATABASE_URL: postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator
    depends_on:
      postgres:
        condition: service_healthy
  
volumes:
  ollama-data:
  postgres_data:
                    