[project]
name = "benchmark-orchestration-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "greenlet>=3.5.5",
    "psycopg[binary]>=3.3.4",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "ruff>=0.16.2",
    "sqlalchemy>=2.0.52",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/orchestrator",
    "services/inference_service",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "services/orchestrator/tests",
    "services/inference_service/tests",
]
