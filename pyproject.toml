[project]
name = "benchmark-orchestration-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/orchestrator",
    "services/inference_service",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "services/orchestrator/tests",
    "services/inference_service/tests",
]