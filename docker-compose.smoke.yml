services:
  redis:
    image: redis:7

  fake-inference:
    build:
      context: ./tests/docker/fake_inference

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 2s
      timeout: 2s
      retries: 10

  orchestrator-test:
    build:
      context: ./services/orchestrator

    environment:
      INFERENCE_ENDPOINT: http://fake-inference:8000/infer
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      fake-inference:
        condition: service_healthy
      redis:
        condition: service_started

    volumes:
      - ./data:/app/data

    command:
      - "orchestrator"
      - "--queue"
      - "data/queue_smoke.jsonl"
      - "--scheduler"
      - "fixed"
      - "--max-retries"
      - "0"