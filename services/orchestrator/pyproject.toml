[project]
name = "benchmark-orchestrator"
version = "0.1.0"
description = "Orchestrator with AIMD scheduler"
authors = [
    { name = "NicolasL" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.26.8",
    "uvicorn>=0.52.1",
]

[project.scripts]
orchestrator = "orchestrator.interfaces.cli.cli:app_cli"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "orchestrator"
