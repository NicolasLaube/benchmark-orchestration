events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name benchmark-orchestrator.nicolaslaube.com;

        location /api/ {
            proxy_pass http://orchestrator-api:3000/;

            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 443 ssl;
        server_name benchmark-orchestrator.nicolaslaube.com;

        ssl_certificate /etc/letsencrypt/live/benchmark-orchestrator.nicolaslaube.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/benchmark-orchestrator.nicolaslaube.com/privkey.pem;

        location /api/ {
            proxy_pass http://orchestrator-api:3000/;

            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 80;
        server_name auth.benchmark-orchestrator.nicolaslaube.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name auth.benchmark-orchestrator.nicolaslaube.com;

        ssl_certificate /etc/letsencrypt/live/benchmark-orchestrator.nicolaslaube.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/benchmark-orchestrator.nicolaslaube.com/privkey.pem;

        location / {
            proxy_pass http://keycloak:8080;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}