services:
  frontend:
    image: ${ECR_REGISTRY}/benchmark-frontend:${IMAGE_TAG:-latest}

    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

    depends_on:
      - orchestrator-api

    volumes:
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 5s

  ollama-init:
    image: ollama/ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: 
      - pull
      - ${MODEL_NAME:-qwen2.5:0.5b}
  inference-service:
    image: ${ECR_REGISTRY}/benchmark-inference:${IMAGE_TAG:-latest}
    
    depends_on:
      ollama-init:
        condition: service_completed_successfully

    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      ]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:0.5b}
      HOST: 0.0.0.0
      PORT: ${INFERENCE_PORT:-8000}
      OLLAMA_TIMEOUT_SEC: 120

    command:
      - "--rpm"
      - "${INFERENCE_RPM:-60}"
      - "--max-concurrency"
      - "${INFERENCE_MAX_CONCURRENCY:-4}"

  orchestrator-api:
    image: ${ECR_REGISTRY}/benchmark-orchestrator:${IMAGE_TAG:-latest}

    depends_on:
      inference-service:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      INFERENCE_ENDPOINT: http://inference-service:${INFERENCE_PORT:-8000}/infer
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}

      KEYCLOAK_URL: http://keycloak:8080
      ISSUER_BASE_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}

    command:
      - uv
      - run
      - uvicorn
      - orchestrator.interfaces.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "${ORCHESTRATOR_PORT:-3000}"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [
          "CMD-SHELL", 
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7

  persistence-consumer:
    image: ${ECR_REGISTRY}/benchmark-orchestrator:${IMAGE_TAG:-latest}

    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}

    command:
      - python
      - -m
      - orchestrator.infrastructure.messaging.redis.persistence_consumer
  
  migrate:
    image: ${ECR_REGISTRY}/benchmark-orchestrator:${IMAGE_TAG:-latest}

    command:
      - uv
      - run
      - alembic
      - upgrade
      - head
    environment:
      DATABASE_URL: ${DATABASE_URL_SYNC}
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command:
    - start-dev
    - --import-realm
    - --hostname=${KEYCLOAK_PUBLIC_URL}
    - --proxy-headers=xforwarded
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8081:8080"

  certbot:
    image: certbot/certbot:latest

    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

    profiles:
      - tools
  
volumes:
  ollama-data:
  postgres_data:
  keycloak_data:
  certbot_www:
  certbot_conf:
                    