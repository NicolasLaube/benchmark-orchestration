name: CI

on:
  push:
  pull_request:

jobs:
  quality: 
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      
      - name: Install dependencies
        run: uv sync --locked --all-packages --dev

      - name: Lint
        run: uv run ruff check .

      - name: Run orchestrator tests
        run: uv run pytest services/orchestrator/tests/unit

      - name: Run inference service tests
        run: uv run pytest services/inference_service/tests/unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install dependencies
        run: uv sync --locked --all-packages --dev

      - name: Run integration tests
        run: uv run pytest \
          services/inference_service/tests/integration \
          services/orchestrator/tests/integration

  docker-build:
    name: Docker

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose
        run: docker compose config --quiet

      - name: Build inference service
        run: docker build -t inference-service ./services/inference_service

      - name: Build orchestrator
        run: docker build -t orchestrator ./services/orchestrator