name: CI

on:
  push:
  pull_request:

jobs:
  test: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      
      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Launch tests
        run: uv run pytest

      